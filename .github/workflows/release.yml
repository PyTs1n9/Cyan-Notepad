# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Build and Release

# Actions 运行记录的名称默认取提交信息，这里固定为「Qing Notepad v<版本>」，
# 与 Release 标题保持一致；手动触发（非 tag）时退化为 dev (<分支>)。
run-name: Qing Notepad ${{ github.ref_type == 'tag' && github.ref_name || format('dev ({0})', github.ref_name) }}

"on":
  push:
    tags:
      - 'v*'           # 推送 v1.0.0 这类 tag 时触发
  workflow_dispatch:    # 也支持手动触发

# 授予 GITHUB_TOKEN 写入权限，否则无法创建 Release
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"  # 修复 Node.js 20 弃用警告

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"              # 自动缓存 node_modules，加速 npm ci

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"   # 缓存 src-tauri/target/，加速 cargo build

      - name: 安装前端依赖
        run: npm ci

      # The tag is the source of truth for releases. Keep all Tauri/package
      # manifests aligned before tauri-action reads the bundle version.
      - name: 同步发布版本
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run version:set -- "${{ github.ref_name }}"

      - name: 构建 Tauri 应用
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          VITE_SUPABASE_URL: "https://skwkzymlhqwgygwwlxoy.supabase.co"
          VITE_SUPABASE_ANON_KEY: "sb_publishable_8TIwPzBdrHmYEwhnikfk5g_sVjODHwW"
          VITE_COLLAB_URL: "${{ vars.VITE_COLLAB_URL }}"
        with:
          tagName: "${{ github.ref_name }}"
          releaseName: 'Qing Notepad v__VERSION__'
          releaseBody: |
            ## 公告：

            - QQ 群：902898359
            - 问题反馈 QQ：34339329934
            - 如有严重 bug，将在 v0.7.x 中修复。

            ## 本次更新 | ${{ github.ref_name }}

            ### 新增

            - **工作台概览面板**：进入工作台后先看到概览页，集中展示文档与成员概览、
              最近文档与快捷入口（新建文档 / 新建工作台 / 加入工作台 / 管理权限与设置），
              不再直接跳进第一篇文档。
            - **数据目录迁移与存储设置**：设置中新增「存储」页，可将整个 `data/` 迁移到
              任意磁盘目录；迁移采用同卷即时改名、跨卷拷贝后校验再删除，指针文件最后写入，
              失败不会指向半截资料库。
            - **AI 模型管理升级**：支持添加多个 OpenAI 兼容端点（DeepSeek 等），一键
              「搜索模型」拉取可用模型并选择；内置多家厂商品牌图标，端点与密钥仅存本机。

            ### 改进

            - 顶栏仅保留「帮助」菜单，视图切换移入活动栏、文档动作归各视图条带，交互更清晰。
            - 统一弹窗底座与悬停浮层，弹窗、下拉与浮层交互一致。
            - 壳层玻璃与三浮卡布局统一，窗口几何在各断点保持一致。
            - 回答以流式文字输出，生成过程可随时停止；检索为关键词与语义向量混合排序。
            - API Key 经 Windows 系统加密后仅存本机，不写入配置文件，也不上传。

            ### 注意

            - 检索模型与推理运行时随安装包分发，因此安装包比早期版本更大（本版 NSIS 安装包约 26MB）。
            - 云端问答与润色需自备对应厂商 API Key；未配置时仍可使用本地「小青」。
            - 本地「小青」完全离线，索引覆盖功能手册、常见问答、笔记、便签、待办与画布文本，
              回收站内容不参与检索，不联网也不消耗额度。
            - 本次移除了旧版的实时网页搜索能力；DeepSeek 等云端模型问答仅以本地检索内容为上下文。

            ## 下载 | Download

            - `QingNotepad_<version>_x64-setup.exe` — Windows NSIS 安装包。
            - `QingNotepad.exe` — 自包含可执行文件（无需额外运行时，开箱即用）。
          releaseDraft: "false"
          prerelease: "false"
