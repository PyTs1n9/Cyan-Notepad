# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Build and Release

"on":
  push:
    tags:
      - 'v*'           # 推送 v1.0.0 这类 tag 时触发
  workflow_dispatch:    # 也支持手动触发

# 授予 GITHUB_TOKEN 写入权限，否则无法创建 Release
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"  # 修复 Node.js 20 弃用警告

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"              # 自动缓存 node_modules，加速 npm ci

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"   # 缓存 src-tauri/target/，加速 cargo build

      - name: 安装前端依赖
        run: npm ci

      # The tag is the source of truth for releases. Keep all Tauri/package
      # manifests aligned before tauri-action reads the bundle version.
      - name: 同步发布版本
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run version:set -- "${{ github.ref_name }}"

      - name: 构建 Tauri 应用
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          VITE_SUPABASE_URL: "https://skwkzymlhqwgygwwlxoy.supabase.co"
          VITE_SUPABASE_ANON_KEY: "sb_publishable_8TIwPzBdrHmYEwhnikfk5g_sVjODHwW"
          VITE_COLLAB_URL: "${{ vars.VITE_COLLAB_URL }}"
        with:
          tagName: "${{ github.ref_name }}"
          releaseName: 'Qing Notepad v__VERSION__'
          releaseBody: |
            ## 公告：

            - QQ群：  902898359
            - 问题反馈QQ：34339329934
            - 如果有严重bug，会修复于v0.6.x版本中。

            ## 本次更新 | ${{ github.ref_name }}

            ### 新增

            - **AI 助手「小青」**：右侧栏新增 AI 面板，顶部可在「小青（本地）」与「DeepSeek（API）」
              两个模型间切换，选择会被记住。
            - **本地知识库问答**：索引覆盖功能手册、常见问答、笔记、便签、待办与画布文本，
              回收站内容不参与检索；全程离线，不消耗任何额度。
            - **DeepSeek 问答**：以检索到的本地内容为上下文生成回答；可开启实时网页搜索，
              默认开启、随时关闭。
            - **AI 润色**：选中文字后一键改写，内置「润色 / 更简洁 / 更正式 / 更口语化」四种风格，
              并可补充自定义要求；结果先预览再应用，应用后可撤销。
            - **对话式笔记改写**：在对话中直接让 AI 修改笔记，每次写入前自动留存快照，支持按条撤销。

            ### 改进

            - 回答以流式文字输出，生成过程可随时停止。
            - 检索改为关键词与语义向量混合排序，菜单名、快捷键这类术语与口语化记录都能命中。
            - API Key 经 Windows 系统加密后仅存本机，不写入配置文件，也不上传。

            ### 注意

            - 检索模型与推理运行时随安装包分发，因此安装包比早期版本更大（本版 NSIS 安装包约 26MB）。
            - 云端问答与润色需自备 DeepSeek API Key；未配置时仍可使用本地「小青」。
            - 使用 DeepSeek 时，检索片段、选中文字与提问内容会发送至 DeepSeek 与搜索服务；
              「小青」模式完全离线。

            ## 下载 | Download

            - `QingNotepad_<version>_x64-setup.exe` — Windows NSIS 安装包。
            - `QingNotepad.exe` — 自包含可执行文件（无需额外运行时，开箱即用）。
          releaseDraft: "false"
          prerelease: "false"
