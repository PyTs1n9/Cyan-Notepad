# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Build and Release

# Actions 运行记录的名称默认取提交信息，这里固定为「Qing Notepad v<版本>」，
# 与 Release 标题保持一致；手动触发（非 tag）时退化为 dev (<分支>)。
run-name: Qing Notepad ${{ github.ref_type == 'tag' && github.ref_name || format('dev ({0})', github.ref_name) }}

"on":
  push:
    tags:
      - 'v*'           # 推送 v1.0.0 这类 tag 时触发
  workflow_dispatch:    # 也支持手动触发

# 授予 GITHUB_TOKEN 写入权限，否则无法创建 Release
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"  # 修复 Node.js 20 弃用警告

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"              # 自动缓存 node_modules，加速 npm ci

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"   # 缓存 src-tauri/target/，加速 cargo build

      - name: 安装前端依赖
        run: npm ci

      # The tag is the source of truth for releases. Keep all Tauri/package
      # manifests aligned before the bundle is built.
      - name: 同步发布版本
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run version:set -- "${{ github.ref_name }}"

      - name: 构建 Tauri 应用
        run: npm run tauri build
        env:
          VITE_SUPABASE_URL: "https://skwkzymlhqwgygwwlxoy.supabase.co"
          VITE_SUPABASE_ANON_KEY: "sb_publishable_8TIwPzBdrHmYEwhnikfk5g_sVjODHwW"
          VITE_COLLAB_URL: "${{ vars.VITE_COLLAB_URL }}"

      - name: 创建或更新 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: "${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}"
          RELEASE_TAG: "${{ github.ref_name }}"
          RELEASE_TITLE: "Qing Notepad ${{ github.ref_name }}"
        run: |
          $notes = @"
          ## 公告：

          - QQ 群：902898359
          - 问题反馈 QQ：34339329934
          - 如有严重 bug，将在 v0.7.x 中修复。

          ## 本次更新 | $env:RELEASE_TAG

          ### 新增

          - **工作台概览面板**：进入工作台后先看到概览页，集中展示文档与成员概览、最近文档与快捷入口。
          - **数据目录迁移与存储设置**：设置中新增存储页，可将整个 `data/` 迁移到任意磁盘目录，并在校验成功后更新路径。
          - **AI 模型管理升级**：支持添加多个 OpenAI 兼容端点、搜索可用模型并选择；端点与密钥仅存本机。

          ### 改进

          - 顶栏、视图切换与文档动作重新整理，交互更清晰。
          - 统一弹窗与悬停浮层样式和交互。
          - 回答支持流式输出，生成过程可停止；检索采用关键词与语义向量混合排序。
          - API Key 经 Windows 系统加密后仅存本机，不写入配置文件，也不上传。

          ### 注意

          - 检索模型与推理运行时随安装包分发，因此安装包比早期版本更大。
          - 云端问答与润色需自备对应厂商 API Key；未配置时仍可使用本地「小青」。
          - 本地「小青」完全离线，回收站内容不参与检索。
          - 本次移除了旧版的实时网页搜索能力；云端模型问答仅以本地检索内容为上下文。

          ## 下载 | Download

          - `QingNotepad_<version>_x64-setup.exe` - Windows NSIS 安装包。
          - `QingNotepad.exe` - 自包含可执行文件。
          "@
          $notes | Set-Content -LiteralPath release-notes.md -Encoding utf8

          gh api "repos/$env:GITHUB_REPOSITORY" --jq .full_name | Out-Null
          if ($LASTEXITCODE -ne 0) {
            throw "The release token cannot access repository $env:GITHUB_REPOSITORY. Configure RELEASE_TOKEN with repository contents write access."
          }

          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --verify-tag `
              --title $env:RELEASE_TITLE `
              --notes-file release-notes.md
          }

          $assets = Get-ChildItem -LiteralPath "src-tauri/target/release/bundle/nsis" -File |
            Where-Object { $_.Extension -in @('.exe', '.sig', '.zip') } |
            Select-Object -ExpandProperty FullName
          if (-not $assets) {
            throw "No NSIS bundle artifacts were produced."
          }
          gh release upload $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --clobber $assets
